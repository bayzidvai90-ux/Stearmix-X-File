name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle Wrapper
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found: $GRADLEW"
          echo "Gradle directory: $GRADLE_DIR"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-Debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
